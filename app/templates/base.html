<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Connect Suggests{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    .htmx-indicator { opacity: 0; transition: opacity 150ms ease-out; }
    .htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .htmx-indicator { transition: none; } }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-3">
      <a href="/" class="font-semibold tracking-tight focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">Connect Suggests</a>
      <nav class="flex gap-1 text-sm">
        <a href="/a1" class="rounded px-2 py-1 text-slate-700 hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">A1 · What Google shows now</a>
        <a href="/suggest" class="rounded px-2 py-1 text-slate-700 hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">Suggestions</a>
        <a href="/demo" class="rounded px-2 py-1 text-slate-700 hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">Demo</a>
        <a href="/ops" class="rounded px-2 py-1 text-slate-700 hover:bg-slate-100 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">Ops</a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-4 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
