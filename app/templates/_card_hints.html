{% if p %}
<p class="text-sm text-ink-200">
  {{ p.date | nice_date }}:
  {% if p.answer == 'closed' %}<strong class="text-ink-50">closed</strong>{% elif p.answer == 'regular' %}regular hours <span class="hours">{{ p.hours }}</span>{% else %}other hours: type them below{% endif %}.
  <span class="text-xs text-ink-500">Saved when you press Approve.</span>
</p>
{% if p.answer == 'special' %}
<label for="answer_hours" class="label mt-3">Hours on {{ p.date | nice_date }}</label>
<input id="answer_hours" name="answer_hours" form="card-form" autocomplete="off" placeholder="e.g. 10-14" class="field hours mt-1.5 max-w-[12rem]">
{% endif %}
{% endif %}
