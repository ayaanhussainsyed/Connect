<!doctype html>
<html lang="{{ card.lang if card is defined and card else 'en' }}">
<head>
  {% include "_head.html" %}
  <meta name="robots" content="noindex">
  <title>{% block title %}Fonecta Connect{% endblock %}</title>
</head>
<body>
  <header class="border-b border-ink-800">
    <div class="mx-auto flex max-w-3xl items-center gap-2.5 px-5 py-3.5">
      <span class="h-2.5 w-2.5 rounded-full bg-signal" aria-hidden="true"></span>
      <span class="text-[15px] font-semibold tracking-tight text-ink-50">Fonecta Connect</span>
    </div>
  </header>
  <main class="mx-auto max-w-3xl px-5 pb-16 pt-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
